<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Something exciting is coming soon to Frost & Flurry! Stay tuned for fresh flavors, seasonal features, and frozen innovations.">
    <title>Coming Soon | Frost & Flurry — Shaved Ice & Snow Cone Shop</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="fullscreen-page">

<!-- Top Bar -->
<div class="fullscreen-topbar">
    <a href="index.html" class="nav-logo" aria-label="Frost & Flurry Home">
        <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 2px 8px rgba(255, 99, 72, 0.4));flex-shrink:0;">
            <path d="M25 45 L35 92 L65 92 L75 45 Z" fill="var(--primary)" rx="3"/>
            <ellipse cx="50" cy="45" rx="26" ry="6" fill="var(--secondary)" opacity="0.25"/>
            <circle cx="50" cy="28" r="22" fill="var(--secondary)"/>
            <circle cx="42" cy="23" r="8" fill="var(--primary)" opacity="0.65"/>
            <circle cx="58" cy="26" r="7" fill="#FFC312" opacity="0.55"/>
            <circle cx="50" cy="16" r="6" fill="#A3CB38" opacity="0.55"/>
            <circle cx="50" cy="38" r="3" fill="white" opacity="0.6"/>
            <circle cx="44" cy="35" r="2" fill="white" opacity="0.4"/>
        </svg>
        <div class="nav-logo-text">
            <span class="brand-top">FROST</span>
            <span class="brand-bottom">& Flurry</span>
        </div>
    </a>
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction" aria-label="Toggle direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <span class="theme-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
        </button>
    </div>
</div>

<!-- Content -->
<div class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;margin:0 auto;">
        <!-- Decorative glow -->
        <div style="position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);width:min(450px, 90vw);height:min(450px, 90vw);background:radial-gradient(circle,rgba(255,99,72,0.12),rgba(10,189,227,0.06),transparent 70%);border-radius:50%;pointer-events:none;"></div>

        <div style="position:relative;z-index:2;">
            <div class="section-label" style="justify-content:center;margin-bottom:1rem;">
                <i class="fa-solid fa-screwdriver-wrench"></i>
                Under Construction
            </div>
            <h1 class="coming-title">Something Cool Is Brewing</h1>
            <p class="coming-desc">
                We're crafting something refreshing and delicious for you behind the scenes. This feature will be available soon. Subscribe to get notified!
            </p>

            <!-- Countdown -->
            <div class="countdown-grid" id="countdown">
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-days">30</div>
                    <div class="countdown-label">Days</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-hours">12</div>
                    <div class="countdown-label">Hours</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-mins">45</div>
                    <div class="countdown-label">Minutes</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-secs">30</div>
                    <div class="countdown-label">Seconds</div>
                </div>
            </div>

            <!-- Subscribe -->
            <form class="subscribe-form" onsubmit="event.preventDefault(); alert('Subscribed! We will notify you when this page launches.'); this.reset();">
                <input type="email" placeholder="your@email.com" required>
                <button type="submit" class="btn btn-primary">Notify Me</button>
            </form>

            <!-- Action buttons -->
            <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem;">
                <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Back to Home</a>
                <a href="contact.html" class="btn btn-secondary">Contact Us</a>
            </div>

            <!-- Social -->
            <div class="coming-socials">
                <a href="#" class="coming-social-link" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" class="coming-social-link" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="coming-social-link" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
                <a href="#" class="coming-social-link" aria-label="Twitter"><i class="fa-brands fa-x-twitter"></i></a>
            </div>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initAuthPage();

        // 30-day countdown timer
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 30);

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;
            if (diff <= 0) return;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
            document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
            document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    });
</script>
</body>
</html>
