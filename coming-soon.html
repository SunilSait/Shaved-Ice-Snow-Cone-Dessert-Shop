<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Something exciting is coming soon to Frost & Flurry! Stay tuned for new flavors, features, and frozen treat innovations.">
    <title>Coming Soon — Frost & Flurry</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="components.js" defer></script>
</head>
<body>
    <div class="coming-soon-page">
        <!-- Top Actions -->
        <div class="coming-soon-top-actions">
            <button class="icon-btn theme-toggle" onclick="toggleTheme(event)" aria-label="Toggle theme">
                <span class="theme-icon-wrap"></span>
            </button>
            <button class="icon-btn dir-toggle" onclick="toggleDir(event)" aria-label="Toggle direction">
                <span class="dir-label"></span>
            </button>
        </div>

        <div class="coming-soon-content">
            <a href="index.html" class="logo-link" style="justify-content:center;margin-bottom:24px;">
                <svg width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M25 45 L35 92 L65 92 L75 45 Z" fill="var(--primary)" rx="3"/>
                    <ellipse cx="50" cy="45" rx="26" ry="6" fill="var(--secondary)" opacity="0.25"/>
                    <circle cx="50" cy="28" r="22" fill="var(--secondary)"/>
                    <circle cx="42" cy="23" r="8" fill="var(--primary)" opacity="0.65"/>
                    <circle cx="58" cy="26" r="7" fill="#FFC312" opacity="0.55"/>
                    <circle cx="50" cy="16" r="6" fill="#A3CB38" opacity="0.55"/>
                    <circle cx="50" cy="38" r="3" fill="white" opacity="0.6"/>
                    <circle cx="44" cy="35" r="2" fill="white" opacity="0.4"/>
                </svg>
                <span class="logo-text" style="font-size:1.3rem;font-weight:700;">Frost & Flurry</span>
            </a>

            <div class="coming-soon-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/><line x1="19.07" y1="4.93" x2="4.93" y2="19.07"/></svg>
            </div>

            <h2>Something Cool Is Brewing</h2>
            <p>We're crafting something new and exciting behind the scenes. Stay tuned for fresh flavors, features, and frozen innovations!</p>

            <!-- Countdown -->
            <div class="countdown-row" id="countdown">
                <div class="countdown-item">
                    <span class="countdown-number" id="cd-days">00</span>
                    <span class="countdown-label">Days</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="cd-hours">00</span>
                    <span class="countdown-label">Hours</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="cd-minutes">00</span>
                    <span class="countdown-label">Minutes</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="cd-seconds">00</span>
                    <span class="countdown-label">Seconds</span>
                </div>
            </div>

            <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;">
                <a href="index.html" class="btn btn-primary">Back to Home</a>
                <a href="contact.html" class="btn btn-secondary">Contact Us</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const html = document.documentElement;
            const savedTheme = localStorage.getItem('frost_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) html.classList.add('dark');
            if (localStorage.getItem('frost_dir') === 'rtl') html.setAttribute('dir', 'rtl');

            const isDark = html.classList.contains('dark');
            const isRTL = html.getAttribute('dir') === 'rtl';
            document.querySelectorAll('.theme-icon-wrap').forEach(el => {
                el.innerHTML = isDark
                    ? '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
                    : '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
            });
            document.querySelectorAll('.dir-label').forEach(el => {
                el.textContent = isRTL ? 'LTR' : 'RTL';
            });

            // Countdown — 30 days from now
            const target = new Date();
            target.setDate(target.getDate() + 30);
            function updateCountdown() {
                const now = new Date();
                const diff = target - now;
                if (diff <= 0) return;
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                document.getElementById('cd-days').textContent = String(d).padStart(2, '0');
                document.getElementById('cd-hours').textContent = String(h).padStart(2, '0');
                document.getElementById('cd-minutes').textContent = String(m).padStart(2, '0');
                document.getElementById('cd-seconds').textContent = String(s).padStart(2, '0');
            }
            updateCountdown();
            setInterval(updateCountdown, 1000);
        });
    </script>
</body>
</html>
