<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Frost & Flurry account to earn rewards, save favorites, and get exclusive member deals on shaved ice and snow cones.">
    <title>Sign Up — Frost & Flurry</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="components.js" defer></script>
</head>
<body>
    <div class="auth-page">
        <!-- Top Actions -->
        <div class="auth-top-actions">
            <button class="icon-btn theme-toggle" onclick="toggleTheme(event)" aria-label="Toggle theme">
                <span class="theme-icon-wrap"></span>
            </button>
            <button class="icon-btn dir-toggle" onclick="toggleDir(event)" aria-label="Toggle direction">
                <span class="dir-label"></span>
            </button>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
            <div class="auth-logo">
                <a href="index.html" aria-label="Go to homepage">
                    <svg width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M25 45 L35 92 L65 92 L75 45 Z" fill="var(--primary)" rx="3"/>
                        <ellipse cx="50" cy="45" rx="26" ry="6" fill="var(--secondary)" opacity="0.25"/>
                        <circle cx="50" cy="28" r="22" fill="var(--secondary)"/>
                        <circle cx="42" cy="23" r="8" fill="var(--primary)" opacity="0.65"/>
                        <circle cx="58" cy="26" r="7" fill="#FFC312" opacity="0.55"/>
                        <circle cx="50" cy="16" r="6" fill="#A3CB38" opacity="0.55"/>
                        <circle cx="50" cy="38" r="3" fill="white" opacity="0.6"/>
                        <circle cx="44" cy="35" r="2" fill="white" opacity="0.4"/>
                    </svg>
                    <span class="logo-text" style="font-size:1.3rem;font-weight:700;">Frost & Flurry</span>
                </a>
            </div>
            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Join the Frost & Flurry rewards community</p>
            </div>

            <!-- Social Sign Up -->
            <div class="auth-social-btns">
                <button type="button" class="social-login-btn" id="google-signup-btn">
                    <i class="fa-brands fa-google" style="font-size:18px;"></i>
                    Sign up with Google
                </button>
                <button type="button" class="social-login-btn" id="apple-signup-btn">
                    <i class="fa-brands fa-apple" style="font-size:20px;"></i>
                    Sign up with Apple
                </button>
            </div>

            <div class="auth-divider"><span>or sign up with email</span></div>

            <!-- Signup Form -->
            <form class="auth-form" onsubmit="event.preventDefault(); alert('Account created successfully!');">
                <div class="form-group">
                    <label class="form-label" for="signup-first-name">First Name</label>
                    <input type="text" class="form-input" id="signup-first-name" placeholder="Your first name" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-last-name">Last Name</label>
                    <input type="text" class="form-input" id="signup-last-name" placeholder="Your last name" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-email">Email Address</label>
                    <input type="email" class="form-input" id="signup-email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-password">Password</label>
                    <div class="password-input-wrap">
                        <input type="password" class="form-input" id="signup-password" placeholder="Create a strong password" required>
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('signup-password', this)" aria-label="Toggle password visibility">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-confirm-password">Confirm Password</label>
                    <div class="password-input-wrap">
                        <input type="password" class="form-input" id="signup-confirm-password" placeholder="Confirm your password" required>
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('signup-confirm-password', this)" aria-label="Toggle password visibility">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom:20px;">
                    <label class="remember-me">
                        <input type="checkbox" id="agree-terms" required> I agree to the <a href="coming-soon.html" style="color:var(--primary);font-weight:600;">Terms of Service</a> and <a href="coming-soon.html" style="color:var(--primary);font-weight:600;">Privacy Policy</a>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const html = document.documentElement;
            const savedTheme = localStorage.getItem('frost_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) html.classList.add('dark');
            if (localStorage.getItem('frost_dir') === 'rtl') html.setAttribute('dir', 'rtl');

            const isDark = html.classList.contains('dark');
            const isRTL = html.getAttribute('dir') === 'rtl';
            document.querySelectorAll('.theme-icon-wrap').forEach(el => {
                el.innerHTML = isDark
                    ? '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
                    : '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
            });
            document.querySelectorAll('.dir-label').forEach(el => {
                el.textContent = isRTL ? 'LTR' : 'RTL';
            });
        });
    </script>
</body>
</html>
